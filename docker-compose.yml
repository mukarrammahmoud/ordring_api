version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ordring_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ordring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordring_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ordring_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ordring}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
